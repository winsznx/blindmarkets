[package]
name = "blindmarkets-solver"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json"] }
starknet = "0.9"
hex = "0.4"
chrono = "0.4"
tokio-tungstenite = "0.21"
futures = "0.3"
sha3 = "0.10"
aes-gcm = "0.10"
rand_core = "0.6"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
starknet-crypto = "0.6"
