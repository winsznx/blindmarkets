[package]
name = "blindmarkets-coordinator"
version = "1.0.0"
edition = "2021"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1.0"
thiserror = "1.0"
starknet = "0.17"
reqwest = { version = "0.11", features = ["json"] }
chrono = "0.4"
